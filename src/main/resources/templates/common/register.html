<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký thành viên</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container form-container">
        <div class="auth-box">
            <h2>Đăng ký tài khoản</h2>

            <div th:if="${error}" class="alert alert-error" th:text="${error}">Lỗi hệ thống</div>

            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label>Tên đăng nhập:</label>
                    <input type="text" th:field="*{username}" class="form-control">
                    <p style="color: red; font-size: 0.8rem;" th:if="${#fields.hasErrors('username')}"
                        th:errors="*{username}"></p>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" th:field="*{email}" class="form-control">
                    <p style="color: red; font-size: 0.8rem;" th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}"></p>
                </div>
                <div class="form-group">
                    <label>Mật khẩu:</label>
                    <input type="password" th:field="*{password}" class="form-control">
                    <p style="color: red; font-size: 0.8rem;" th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}"></p>
                </div>
                <button type="submit" class="btn-primary">Tạo tài khoản</button>
            </form>
            <p class="auth-switch">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a></p>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
</body>

</html>
