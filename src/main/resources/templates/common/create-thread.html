<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Hồ sơ cá nhân</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container form-container">
        <div class="content-box">
            <h2>Hồ sơ cá nhân: <span th:text="${user.username}"></span></h2>

            <div th:if="${param.success}" class="alert alert-success">
                Cập nhật thành công!
            </div>

            <div th:if="${param.error}" class="alert alert-error">
                Mật khẩu cũ không chính xác!
            </div>

            <form th:action="@{/profile/update}" method="post" style="margin-bottom: 30px;">

                <div class="form-group">
                    <label>Email liên hệ:</label>
                    <input type="email" name="email" th:value="${user.email}" class="form-control" required>
                </div>

                <!-- Họ và tên -->
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold;">Họ và tên (Bắt buộc):</label>
                    <input type="text" name="fullName" th:value="${user.fullName}"
                        style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; background-color: #f8f9fa;"
                        required>
                </div>

                <!-- Bio -->
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold;">Tiểu sử (Bio):</label>
                    <textarea name="bio" rows="3" th:text="${user.bio}"
                        style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>

                <!-- Avatar -->
                <div style="margin-bottom: 15px;">
                    <label style="font-weight: bold;">Đường dẫn ảnh đại diện (Avatar URL):</label>
                    <input type="text" name="avatar" th:value="${user.avatar}"
                        placeholder="https://example.com/anh-cua-toi.jpg"
                        style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <button type="submit" class="btn-primary">
                    Lưu thông tin cá nhân
                </button>
            </form>

            <hr style="margin-bottom: 20px;">

            <h3>Đổi mật khẩu</h3>

            <form th:action="@{/profile/change-password}" method="post">
                <div class="form-group">
                    <label>Mật khẩu cũ:</label>
                    <input type="password" name="oldPassword" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Mật khẩu mới:</label>
                    <input type="password" name="newPassword" class="form-control" required minlength="6">
                </div>

                <button type="submit" class="btn-danger">
                    Cập nhật mật khẩu
                </button>
            </form>
        </div>
    </div>
</body>

</html>
